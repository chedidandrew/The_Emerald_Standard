plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

def artifactVersion = mod_version.toString()
def configuredModId = mod_id.toString()

version = artifactVersion
group = mod_group_id

base {
    archivesName = 'the-emerald-standard-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir('../common/src/minecraft/java')
sourceSets.main.java.srcDir('../common/src/client/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')
sourceSets.main.resources.srcDir('src/generated/resources')

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${configuredModId}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.register('verifyBankerMenuPacket', JavaExec) {
    group = 'verification'
    description = 'Round-trips Banker values through the real Minecraft menu packet codec.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.chedidandrew.emeraldstandard.minecraft.BankerMenuPacketCodecSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('verifyBankerMenuPacket')
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'The Emerald Standard',
                'Implementation-Version': artifactVersion)
    }
    from('../LICENSE') {
        rename { "${it}_${configuredModId}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
