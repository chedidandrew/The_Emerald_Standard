// Isolated visual-QA launcher. This script is deliberately separate from the interactive gallery
// launcher because only this entry point grants the client permission to move the camera and write
// a review batch. The Minecraft-side gate independently verifies the exact disposable save.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('fabric-loom') {
        def targetPath = project.providers.gradleProperty('tesGalleryGameDir').get()
        def scope = project.providers.gradleProperty('tesGalleryCaptureScope').orElse('complete').get()
        def reviewPass = project.providers.gradleProperty('tesGalleryReviewPass').orElse('1').get()
        def captureLimit = project.providers.gradleProperty('tesGalleryCaptureLimit').orElse('').get()
        def captureStartSequence = project.providers.gradleProperty('tesGalleryCaptureStartSequence').orElse('').get()
        project.extensions.getByName('loom').runs.named('client').configure {
            runDirectory = project.file(targetPath)
            vmArg '-Dthe_emerald_standard.structureGallery=true'
            vmArg '-Dthe_emerald_standard.structureGallery.autoBuild=true'
            vmArg '-Dthe_emerald_standard.structureGallery.capture=true'
            vmArg "-Dthe_emerald_standard.structureGallery.capture.scope=${scope}"
            vmArg "-Dthe_emerald_standard.structureGallery.capture.reviewPass=${reviewPass}"
            if (!captureLimit.isBlank()) {
                vmArg "-Dthe_emerald_standard.structureGallery.capture.limit=${captureLimit}"
            }
            if (!captureStartSequence.isBlank()) {
                vmArg "-Dthe_emerald_standard.structureGallery.capture.startSequence=${captureStartSequence}"
            }
            vmArg '-Dthe_emerald_standard.structureGallery.capture.stopWhenComplete=true'
            programArgs '--width', '1920', '--height', '1080',
                    '--quickPlaySingleplayer', 'TES_Blueprint_V2_Gallery'
        }
    }

    project.pluginManager.withPlugin('net.neoforged.moddev') {
        def targetPath = project.providers.gradleProperty('tesGalleryGameDir').get()
        def scope = project.providers.gradleProperty('tesGalleryCaptureScope').orElse('complete').get()
        def reviewPass = project.providers.gradleProperty('tesGalleryReviewPass').orElse('1').get()
        def captureLimit = project.providers.gradleProperty('tesGalleryCaptureLimit').orElse('').get()
        def captureStartSequence = project.providers.gradleProperty('tesGalleryCaptureStartSequence').orElse('').get()
        def neoForgeExtension = project.extensions.getByName('neoForge')
        neoForgeExtension.runs.configureEach { run ->
            if (run.name == 'client') {
                run.gameDirectory.set(project.file(targetPath))
                run.systemProperty('the_emerald_standard.structureGallery', 'true')
                run.systemProperty('the_emerald_standard.structureGallery.autoBuild', 'true')
                run.systemProperty('the_emerald_standard.structureGallery.capture', 'true')
                run.systemProperty('the_emerald_standard.structureGallery.capture.scope', scope)
                run.systemProperty('the_emerald_standard.structureGallery.capture.reviewPass', reviewPass)
                if (!captureLimit.isBlank()) {
                    run.systemProperty('the_emerald_standard.structureGallery.capture.limit', captureLimit)
                }
                if (!captureStartSequence.isBlank()) {
                    run.systemProperty(
                            'the_emerald_standard.structureGallery.capture.startSequence',
                            captureStartSequence)
                }
                run.systemProperty(
                        'the_emerald_standard.structureGallery.capture.stopWhenComplete', 'true')
                run.programArgument '--width'
                run.programArgument '1920'
                run.programArgument '--height'
                run.programArgument '1080'
                run.programArgument '--quickPlaySingleplayer'
                run.programArgument 'TES_Blueprint_V2_Gallery'
            }
        }
    }
}
