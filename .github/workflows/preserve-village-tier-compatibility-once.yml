name: Preserve village tier compatibility once

on:
  push:
    branches: [milestone-95]

permissions:
  contents: write

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-95
          fetch-depth: 0
      - name: Restore the proven tier thresholds without removing new projects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('common/src/main/java/com/chedidandrew/emeraldstandard/core/VillageProsperityEngine.java')
          if engine.exists():
              text = engine.read_text()
              text = text.replace(
                  '''        boolean warehouse = completedProjects(village, ProjectType.WAREHOUSE) > 0;\n        boolean mine = completedProjects(village, ProjectType.MINE_ENTRANCE) > 0;\n        boolean market = completedProjects(village, ProjectType.MARKET_SQUARE) > 0;\n        boolean exchange = completedProjects(village, ProjectType.EXCHANGE_HALL) > 0;\n''',
                  '''        boolean warehouse = completedProjects(village, ProjectType.WAREHOUSE) > 0;\n        boolean mine = completedProjects(village, ProjectType.MINE_ENTRANCE) > 0;\n''')
              text = text.replace(
                  '''        } else if (village.population >= 28\n                && village.prosperity >= 75.0\n                && completed >= 8\n                && exchange) {\n            tier = 5;\n        } else if (village.population >= 18\n                && village.prosperity >= 65.0\n                && completed >= 5\n                && market) {\n            tier = 4;''',
                  '''        } else if (village.population >= 28 && village.prosperity >= 75.0 && completed >= 6) {\n            tier = 5;\n        } else if (village.population >= 18 && village.prosperity >= 65.0 && completed >= 4) {\n            tier = 4;''')
              engine.write_text(text)

          script = Path('scripts/apply_milestone_95.py')
          if script.exists():
              text = script.read_text()
              text = text.replace(
                  '''        boolean warehouse = completedProjects(village, ProjectType.WAREHOUSE) > 0;\\n        boolean mine = completedProjects(village, ProjectType.MINE_ENTRANCE) > 0;\\n        boolean market = completedProjects(village, ProjectType.MARKET_SQUARE) > 0;\\n        boolean exchange = completedProjects(village, ProjectType.EXCHANGE_HALL) > 0;''',
                  '''        boolean warehouse = completedProjects(village, ProjectType.WAREHOUSE) > 0;\\n        boolean mine = completedProjects(village, ProjectType.MINE_ENTRANCE) > 0;''')
              text = text.replace(
                  '''        } else if (village.population >= 28\\n                && village.prosperity >= 75.0\\n                && completed >= 8\\n                && exchange) {\\n            tier = 5;\\n        } else if (village.population >= 18\\n                && village.prosperity >= 65.0\\n                && completed >= 5\\n                && market) {\\n            tier = 4;''',
                  '''        } else if (village.population >= 28 && village.prosperity >= 75.0 && completed >= 6) {\\n            tier = 5;\\n        } else if (village.population >= 18 && village.prosperity >= 65.0 && completed >= 4) {\\n            tier = 4;''')
              script.write_text(text)

          changelog = Path('CHANGELOG.md')
          if changelog.exists():
              text = changelog.read_text().replace(
                  '- Development tiers now require more diverse infrastructure at the highest levels, making late-game settlement growth visibly distinct.\n',
                  '- New need-driven projects add late-game variety while preserving the proven development-tier thresholds used by existing worlds.\n')
              changelog.write_text(text)
          PY
          git rm .github/workflows/preserve-village-tier-compatibility-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Preserve existing village development tier thresholds'
          for attempt in 1 2 3; do
            if git push origin HEAD:milestone-95; then
              exit 0
            fi
            git pull --rebase origin milestone-95
          done
          exit 1
