name: Recover 0.4.0 beta candidate once

on:
  push:
    branches: [fix/recover-0.4.0-beta.1]
    paths:
      - .github/workflows/recover-0.4-beta-once.yml

permissions:
  contents: write

concurrency:
  group: recover-0.4-beta-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recover-0.4.0-beta.1
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Recover reviewed milestone source only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main milestone-95
          git checkout origin/milestone-95 -- \
            CHANGELOG.md \
            README.md \
            common/src/client/java/com/chedidandrew/emeraldstandard/client/BankerScreen.java \
            common/src/main/java/com/chedidandrew/emeraldstandard/core/VillageProsperityEngine.java \
            common/src/main/resources/assets/the_emerald_standard/lang/en_us.json \
            common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/BankerAccess.java \
            common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/VillageProsperityManager.java \
            common/src/test/java/com/chedidandrew/emeraldstandard/core/LargeWorldStressRegressionTest.java \
            common/src/test/java/com/chedidandrew/emeraldstandard/core/Milestone95RegressionTest.java \
            common/src/test/java/com/chedidandrew/emeraldstandard/core/ProjectCatalogCompatibilityRegressionTest.java \
            docs/MANUAL_TEST_MATRIX-0.4.md \
            docs/VILLAGE_PROSPERITY.md \
            fabric/gradle.properties \
            neoforge/gradle.properties \
            release/IMPLEMENTATION_LOG-0.4.0-beta.1.md \
            release/RELEASE_NOTES-0.4.0-beta.1.md \
            scripts/run-common-tests.sh

      - name: Apply code, safety, CI, and documentation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text was not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Minecraft 26.2 ServerPlayer does not expose displayClientMessage.
          replace_once(
              "common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/BankerAccess.java",
              '''            player.displayClientMessage(
                      Component.translatable("message.the_emerald_standard.first_banker_visit"),
                      false);''',
              '''            player.sendSystemMessage(
                      Component.translatable("message.the_emerald_standard.first_banker_visit"));''')

          manager = "common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/VillageProsperityManager.java"

          # Remove a conflicting bed/crafting-table coordinate and avoid accidental workstation spam.
          replace_once(
              manager,
              '''        for (int x = 2; x <= 8; x += 2) {
              placements.add(new Placement(x, 1, 6, Blocks.BARREL.defaultBlockState()));
          }
          placements.add(new Placement(5, 1, 3, Blocks.CRAFTING_TABLE.defaultBlockState()));''',
              '''        for (int x = 2; x <= 8; x += 2) {
              placements.add(new Placement(x, 1, 7, Blocks.CHEST.defaultBlockState()));
          }
          placements.add(new Placement(5, 1, 4, Blocks.CRAFTING_TABLE.defaultBlockState()));''')
          replace_once(
              manager,
              '            placements.add(new Placement(x, 1, 2, Blocks.BARREL.defaultBlockState()));',
              '            placements.add(new Placement(x, 1, 2, Blocks.CHEST.defaultBlockState()));')
          replace_once(
              manager,
              '            placements.add(new Placement(x, 1, 4, Blocks.BARREL.defaultBlockState()));',
              '            placements.add(new Placement(x, 1, 4, Blocks.CHEST.defaultBlockState()));')
          replace_once(
              manager,
              '            placements.add(new Placement(x, 1, 5, Blocks.LECTERN.defaultBlockState()));',
              '            placements.add(new Placement(x, 1, 5, Blocks.BOOKSHELF.defaultBlockState()));')
          replace_once(
              manager,
              '        placements.add(new Placement(6, 1, 7, Blocks.CARTOGRAPHY_TABLE.defaultBlockState()));',
              '        placements.add(new Placement(6, 1, 7, Blocks.EMERALD_BLOCK.defaultBlockState()));')

          template_block = '''    private static List<Placement> template(
              ServerLevel level, BlockPos origin, VillageProsperityEngine.ProjectType type) {
          Palette palette = palette(level, origin);
          return switch (type) {
              case COTTAGE -> cottage(palette);
              case HOUSE -> house(palette);
              case INN -> inn(palette);
              case WAREHOUSE -> warehouse(palette);
              case MINE_ENTRANCE -> mineEntrance(palette);
              case MARKET_SQUARE -> marketSquare(palette);
              case SMITHY -> smithy(palette);
              case GRANARY -> granary(palette);
              case GUARD_POST -> guardPost(palette);
              case EXCHANGE_HALL -> exchangeHall(palette);
          };
      }
  '''
          validated_template_block = template_block + '''
      /** Validates every authored template during the live server smoke test. */
      static void validateProjectTemplates(ServerLevel level) {
          BlockPos origin = new BlockPos(0, 64, 0);
          for (VillageProsperityEngine.ProjectType type
                  : VillageProsperityEngine.ProjectType.values()) {
              List<Placement> placements = template(level, origin, type);
              if (placements.isEmpty() || placements.size() > 600) {
                  throw new IllegalStateException(
                          "Invalid physical template size for " + type + ": " + placements.size());
              }
              Set<BlockPos> occupied = new HashSet<>();
              for (Placement placement : placements) {
                  BlockPos relative = new BlockPos(placement.dx, placement.dy, placement.dz);
                  if (!occupied.add(relative)) {
                      throw new IllegalStateException(
                              "Duplicate physical placement for " + type + " at " + relative);
                  }
                  if (placement.state.is(Blocks.BARREL)
                          || placement.state.is(Blocks.LECTERN)
                          || placement.state.is(Blocks.CARTOGRAPHY_TABLE)) {
                      throw new IllegalStateException(
                              "Prosperity template " + type
                                      + " contains an unintended villager workstation at " + relative);
                  }
              }
          }
      }
  '''
          replace_once(manager, template_block, validated_template_block)

          # Make the live integration smoke enumerate all new templates.
          replace_once(
              "common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/BankerIntegrationSelfTest.java",
              '        verifyProtectionGuards(level);\n',
              '        verifyProtectionGuards(level);\n        VillageProsperityManager.validateProjectTemplates(level);\n')

          # Expose one canonical qualitative village score and use it in both market math and UI.
          engine = "common/src/main/java/com/chedidandrew/emeraldstandard/core/VillageProsperityEngine.java"
          market_start = '''    private static MarketContribution marketContribution(EconomyState.VillageRecord village) {
          double population = Math.max(1.0, village.population);
          double weight = Math.min(6.0, StrictMath.sqrt(population));
          double broad = clamp(
                  (village.prosperity - 50.0) / 50.0 * 0.55
                          + (village.safety - 55.0) / 45.0 * 0.35
                          + (village.developmentTier - 1.0) / 5.0 * 0.10,
                  -1.0,
                  1.0);
  '''
          market_replacement = '''    /** Qualitative broad village score used by the market and player-facing outlook. */
      public static double broadFundamentalScore(
              double prosperity, double safety, int developmentTier) {
          return clamp(
                  (prosperity - 50.0) / 50.0 * 0.55
                          + (safety - 55.0) / 45.0 * 0.35
                          + (developmentTier - 1.0) / 5.0 * 0.10,
                  -1.0,
                  1.0);
      }

      private static MarketContribution marketContribution(EconomyState.VillageRecord village) {
          double population = Math.max(1.0, village.population);
          double weight = Math.min(6.0, StrictMath.sqrt(population));
          double broad = broadFundamentalScore(
                  village.prosperity, village.safety, village.developmentTier);
  '''
          replace_once(engine, market_start, market_replacement)

          # Keep the Village page truthful and prevent the new outlook label from overlapping controls.
          screen = "common/src/client/java/com/chedidandrew/emeraldstandard/client/BankerScreen.java"
          replace_once(
              screen,
              '''        double localImpactScore = (menu.villageProsperity() + menu.villageSafety()) / 2.0;
          Component localImpact = localImpactScore >= 72.0
                  ? tr("village.impact.strong")
                  : localImpactScore >= 52.0
                          ? tr("village.impact.positive")
                          : localImpactScore >= 32.0
                                  ? tr("village.impact.neutral")
                                  : tr("village.impact.weak");
          graphics.text(font, localImpact, 16, 163, localImpactScore >= 52.0 ? POSITIVE : GOLD, false);''',
              '''        double localImpactScore = VillageProsperityEngine.broadFundamentalScore(
                  menu.villageProsperity(), menu.villageSafety(), menu.villageTier());
          Component localImpact = localImpactScore >= 0.45
                  ? tr("village.impact.strong")
                  : localImpactScore >= 0.10
                          ? tr("village.impact.positive")
                          : localImpactScore >= -0.20
                                  ? tr("village.impact.neutral")
                                  : tr("village.impact.weak");
          int impactColor = localImpactScore >= 0.10
                  ? POSITIVE
                  : localImpactScore >= -0.20 ? GOLD : NEGATIVE;
          graphics.text(font, localImpact, 16, 163, impactColor, false);''')
          replace_once(
              screen,
              '''                leftPos + 100,
                  topPos + 165,
                  120,
                  BankerMenu.ACTION_SUPPORT_VILLAGE,''',
              '''                leftPos + 188,
                  topPos + 165,
                  120,
                  BankerMenu.ACTION_SUPPORT_VILLAGE,''')

          # Strengthen the loader-neutral milestone guard.
          milestone_test = "common/src/test/java/com/chedidandrew/emeraldstandard/core/Milestone95RegressionTest.java"
          replace_once(
              milestone_test,
              '''        for (VillageProsperityEngine.ProjectType type : VillageProsperityEngine.ProjectType.values()) {
              if (!(type.materialCost() > 0.0) || !(type.treasuryCost() >= 0.0)) {''',
              '''        double[] outlookInputs = {0.0, 25.0, 50.0, 75.0, 100.0};
          for (double prosperity : outlookInputs) {
              for (double safety : outlookInputs) {
                  double score = VillageProsperityEngine.broadFundamentalScore(
                          prosperity, safety, 3);
                  if (!Double.isFinite(score) || score < -1.0 || score > 1.0) {
                      throw new AssertionError("Village outlook score escaped bounds: " + score);
                  }
              }
          }
          for (VillageProsperityEngine.ProjectType type : VillageProsperityEngine.ProjectType.values()) {
              if (!(type.materialCost() > 0.0) || !(type.treasuryCost() >= 0.0)) {''')

          # Keep all deterministic scale checks in the normal read-only common suite.
          common_tests = Path("scripts/run-common-tests.sh")
          common_text = common_tests.read_text(encoding="utf-8")
          marker = "java -cp \"$BUILD\" com.chedidandrew.emeraldstandard.core.Milestone95RegressionTest\n"
          if marker not in common_text:
              raise SystemExit("Milestone regression invocation missing")
          common_text = common_text.replace(
              marker,
              marker + "java -cp \"$BUILD\" com.chedidandrew.emeraldstandard.core.LargeWorldStressRegressionTest\n",
              1)
          common_tests.write_text(common_text, encoding="utf-8")

          # Repair repository presentation and remove contradictory 3-project wording.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "## Village Prosperity\n\nThe 0.4 beta expands visible settlement progression to **10 curated village projects** with need-driven priorities, biome-aware templates, and bounded sector effects. Threatened villages can prioritize defenses, food-poor villages can prioritize storage, crowded villages can prioritize housing, and mature villages can grow into markets, smithies, inns, and an Exchange Hall. System\n\nVillage Prosperity connects",
              "## Village Prosperity System\n\nThe 0.4 beta expands visible settlement progression to **10 curated village projects** with need-driven priorities, biome-aware templates, and bounded sector effects. Threatened villages can prioritize defenses, food-poor villages can prioritize storage, crowded villages can prioritize housing, and mature villages can grow into markets, smithies, inns, and an Exchange Hall.\n\nVillage Prosperity connects")
          text = text.replace(
              "The first development projects are a **Cottage**, **Warehouse**, and **Mine Entrance**. Completed economic projects enter a bounded visual queue and materialize only while players are nearby and the required chunks are already loaded.",
              "The curated project catalog contains **Cottage, House, Village Inn, Warehouse, Mine Entrance, Market Square, Smithy, Granary, Guard Post, and Exchange Hall**. Completed economic projects enter a bounded visual queue and materialize only while players are nearby and the required chunks are already loaded.")
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "# Changelog\n\nAll notable changes to The Emerald Standard are documented here.\n\n"
          text = text.replace(heading, "", 1)
          recovery_note = '''
  ### Recovered and fixed

  - Rebuilt the candidate from the last verified beta.4 main branch instead of merging generated payloads and self-modifying workflows.
  - Fixed the Minecraft 26.2 first-visit message API so both loader projects compile.
  - Fixed a duplicate Inn placement that could permanently block construction.
  - Removed unintended barrel, lectern, and cartography-table job sites from prosperity templates.
  - Added live template validation to server smoke tests and integrated the 100, 500, and 1,000-village scale guard into the normal read-only regression suite.
  - Restored the standard read-only GitHub Actions workflow and excluded temporary payload, transformation, finalizer, and validation workflows from the recovered candidate.

  '''
          split = "## 0.3.0-beta.4 - 2026-09-03"
          if split not in text:
              raise SystemExit("Could not locate beta.4 changelog section")
          before, after = text.split(split, 1)
          text = heading + before.rstrip() + "\n" + recovery_note + split + after
          changelog.write_text(text, encoding="utf-8")

          village_doc = Path("docs/VILLAGE_PROSPERITY.md")
          text = village_doc.read_text(encoding="utf-8")
          text = text.replace("remains Overworld-only in beta.3", "remains Overworld-only in the 0.4 beta")
          text = text.replace("Beta 3 includes three physical project types:\n\n- Cottage\n- Warehouse\n- Mine Entrance",
                              "The 0.4 beta includes ten physical project types:\n\n- Cottage\n- House\n- Village Inn\n- Warehouse\n- Mine Entrance\n- Market Square\n- Smithy\n- Granary\n- Guard Post\n- Exchange Hall")
          text = text.replace(
              "Warehouses and cottages use chests rather than barrels so prosperity buildings do not unintentionally create fisherman workstations.",
              "Housing, storage, commerce, agriculture, and finance templates use non-workstation storage or decoration blocks so they do not silently create unrelated villager jobs. Smithies intentionally contain a small industrial workstation set as part of their gameplay identity.")
          text = text.replace("beta.3 persists its exact state", "the 0.4 beta preserves its exact state")
          village_doc.write_text(text, encoding="utf-8")

          implementation = Path("release/IMPLEMENTATION_LOG-0.4.0-beta.1.md")
          text = implementation.read_text(encoding="utf-8")
          text = text.replace(
              "- Working branch: `milestone-95`\n- Pull request: `#6`",
              "- Original experimental branch: `milestone-95` and draft pull request `#6`\n- Recovered candidate branch: `fix/recover-0.4.0-beta.1`")
          text = text.replace(
              "- Added a dedicated GitHub Actions scale workflow.\n- Added an auditable milestone validation workflow covering common tests, scale tests, both loader builds, package checks, both server smoke tests, and both client smoke tests.",
              "- Integrated the deterministic scale guard into the standard loader-neutral regression suite.\n- Retained the normal read-only GitHub Actions workflow for common tests, both loader builds, package checks, both server smoke tests, and both client smoke tests.")
          text = text.replace(
              "The milestone is eligible to merge only when the generated `release/CI_STATUS-milestone-95.md` reports zero failures for all automated checks. Temporary source-transformation and elevated-permission workflow files are removed before merge. The normal repository workflow returns to read-only permissions.",
              "The recovered milestone is eligible to merge only when the normal read-only `build.yml` workflow passes all seven jobs for the exact pull-request head. Generated payloads, transformation scripts, self-modifying workflows, and stale failure reports are deliberately excluded from the recovered branch.")
          implementation.write_text(text, encoding="utf-8")

          notes = Path("release/RELEASE_NOTES-0.4.0-beta.1.md")
          text = notes.read_text(encoding="utf-8")
          text += '''

  ## Recovery hardening

  The initial experimental milestone branch contained generated payloads, self-modifying workflows, and a Minecraft 26.2 compile error. The release candidate was rebuilt from the last verified beta.4 main branch and includes only reviewed production source, tests, and documentation. It also fixes a duplicate Inn placement and removes accidental villager-workstation blocks from non-industrial templates.
  '''
          notes.write_text(text, encoding="utf-8")

          Path("release/RECOVERY_AUDIT-0.4.0-beta.1.md").write_text('''# 0.4.0-beta.1 Recovery Audit

  ## Why recovery was required

  The draft `milestone-95` branch was 38 commits ahead of the last verified main branch and mixed intended gameplay changes with generated payload files, self-modifying GitHub Actions workflows, transformation scripts, stale failure evidence, and an API call that did not compile on Minecraft 26.2.

  ## Preserved gameplay work

  - Ten compatible Village Prosperity project identifiers
  - Need-driven project planning
  - Biome-aware physical templates
  - Bounded production and upkeep effects
  - First-Banker onboarding
  - Qualitative local village outlook
  - Project-catalog and large-world regression coverage
  - Honest manual test matrix

  ## Repairs applied

  - Replaced the unavailable `ServerPlayer.displayClientMessage` call with the supported server system-message API.
  - Removed a duplicate Inn coordinate where a crafting table overwrote a bed head and blocked materialization.
  - Replaced accidental barrel, lectern, and cartography-table job sites in non-industrial prosperity templates.
  - Added live template uniqueness and unintended-workstation validation to the dedicated-server integration smoke test.
  - Reused the same broad village-fundamental score for both market math and the qualitative Village-page indicator.
  - Moved the Village support button so the new outlook line does not overlap it.
  - Restored the standard read-only build workflow and integrated scale testing without branch-mutating automation.
  - Repaired contradictory README, changelog, Village Prosperity, and release documentation.

  ## Deliberately excluded

  - `.github/milestone-payload/*`
  - One-shot apply, export, inspect, patch, sanitize, and finalizer workflows
  - Repository-transform scripts
  - Generated CI status documents describing superseded failed commits
  - Unmerged portfolio, custom Banker, reconciliation, and other side-branch experiments

  Those experimental branches remain available for later review, but none is silently included in this recovered candidate.
  ''', encoding="utf-8")

          Path("release/BUILD_STATUS.md").write_text('''# Build status for 0.4.0-beta.1

  ## Candidate status

  - Baseline: verified `0.3.0-beta.4` main branch
  - Candidate branch: `fix/recover-0.4.0-beta.1`
  - Automated verification: pending the standard seven-job pull-request workflow
  - Manual test matrix: `docs/MANUAL_TEST_MATRIX-0.4.md`

  This file is intentionally updated again with the exact successful workflow run and merge commit before prerelease publication.
  ''', encoding="utf-8")
          PY

      - name: Run loader-neutral regressions and scale guard
        run: bash scripts/run-common-tests.sh

      - name: Build and verify Fabric candidate
        run: |
          bash fabric/gradlew --no-daemon -p fabric build --stacktrace
          bash scripts/verify-built-jar.sh fabric

      - name: Build and verify NeoForge candidate
        run: |
          bash neoforge/gradlew --no-daemon -p neoforge build --stacktrace
          bash scripts/verify-built-jar.sh neoforge

      - name: Remove the one-shot recovery workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/recover-0.4-beta-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover and harden 0.4.0 beta milestone'
          git push origin HEAD:fix/recover-0.4.0-beta.1
