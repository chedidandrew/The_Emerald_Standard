name: Recover 0.4.0 beta candidate once

on:
  push:
    branches: [fix/recover-0.4.0-beta.1]
    paths:
      - .github/workflows/recover-0.4-beta-once.yml

permissions:
  contents: write

concurrency:
  group: recover-0.4-beta-once
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recover-0.4.0-beta.1
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Recover reviewed milestone source only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main milestone-95
          git checkout origin/milestone-95 -- \
            CHANGELOG.md \
            README.md \
            common/src/client/java/com/chedidandrew/emeraldstandard/client/BankerScreen.java \
            common/src/main/java/com/chedidandrew/emeraldstandard/core/VillageProsperityEngine.java \
            common/src/main/resources/assets/the_emerald_standard/lang/en_us.json \
            common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/BankerAccess.java \
            common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/VillageProsperityManager.java \
            common/src/test/java/com/chedidandrew/emeraldstandard/core/LargeWorldStressRegressionTest.java \
            common/src/test/java/com/chedidandrew/emeraldstandard/core/Milestone95RegressionTest.java \
            common/src/test/java/com/chedidandrew/emeraldstandard/core/ProjectCatalogCompatibilityRegressionTest.java \
            docs/MANUAL_TEST_MATRIX-0.4.md \
            docs/VILLAGE_PROSPERITY.md \
            fabric/gradle.properties \
            neoforge/gradle.properties \
            release/IMPLEMENTATION_LOG-0.4.0-beta.1.md \
            release/RELEASE_NOTES-0.4.0-beta.1.md \
            scripts/run-common-tests.sh

      - name: Apply reviewed repairs
        run: python3 scripts/recover_0_4_beta.py

      - name: Run loader-neutral regressions and scale guard
        run: bash scripts/run-common-tests.sh

      - name: Build and verify Fabric candidate
        run: |
          bash fabric/gradlew --no-daemon -p fabric build --stacktrace
          bash scripts/verify-built-jar.sh fabric

      - name: Build and verify NeoForge candidate
        run: |
          bash neoforge/gradlew --no-daemon -p neoforge build --stacktrace
          bash scripts/verify-built-jar.sh neoforge

      - name: Remove recovery automation and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/recover-0.4-beta-once.yml
          rm scripts/recover_0_4_beta.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover and harden 0.4.0 beta milestone'
          git push origin HEAD:fix/recover-0.4.0-beta.1
