name: Fix 0.4 currency-block safety once

on:
  push:
    branches: [fix/recover-0.4.0-beta.1]
    paths:
      - .github/workflows/fix-0.4-currency-block-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recover-0.4.0-beta.1
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Remove generated currency from the Exchange Hall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(label + ' was not found')
              return text.replace(old, new, 1)

          manager = Path('common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/VillageProsperityManager.java')
          text = manager.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        placements.add(new Placement(6, 1, 7, Blocks.EMERALD_BLOCK.defaultBlockState()));',
              '        placements.add(new Placement(6, 1, 7, Blocks.GREEN_STAINED_GLASS.defaultBlockState()));',
              'Exchange Hall emerald block')
          text = replace_once(
              text,
              '                        || placement.state.is(Blocks.CARTOGRAPHY_TABLE)) {',
              '''                        || placement.state.is(Blocks.CARTOGRAPHY_TABLE)
                        || placement.state.is(Blocks.EMERALD_BLOCK)
                        || placement.state.is(Blocks.DIAMOND_BLOCK)
                        || placement.state.is(Blocks.GOLD_BLOCK)
                        || placement.state.is(Blocks.NETHERITE_BLOCK)) {''',
              'Template safety condition')
          text = replace_once(
              text,
              '                                    + " contains an unintended villager workstation at "',
              '                                    + " contains an unintended workstation or currency block at "',
              'Template safety message')
          manager.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '- Removed unintended barrel, lectern, and cartography-table job sites from prosperity templates.\n'
          addition = marker + '- Replaced the Exchange Hall emerald block with decorative green glass and added a smoke-test ban on generated emerald, diamond, gold, and netherite blocks so village construction cannot mint investable currency.\n'
          changelog.write_text(replace_once(text, marker, addition, 'Changelog recovery marker'), encoding='utf-8')

          audit = Path('release/RECOVERY_AUDIT-0.4.0-beta.1.md')
          text = audit.read_text(encoding='utf-8')
          marker = '- Replaced accidental barrel, lectern, and cartography-table job sites in non-industrial prosperity templates.\n'
          addition = marker + '- Removed the Exchange Hall emerald block and added validation that no prosperity template generates emerald, diamond, gold, or netherite blocks that could be converted into bank capital.\n'
          audit.write_text(replace_once(text, marker, addition, 'Recovery audit marker'), encoding='utf-8')

          notes = Path('release/RELEASE_NOTES-0.4.0-beta.1.md')
          text = notes.read_text(encoding='utf-8')
          text += '\n- Exchange Hall decoration no longer generates an emerald block, and live template checks reject high-value currency blocks.\n'
          notes.write_text(text, encoding='utf-8')
          PY

      - name: Run regressions and both loader builds
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-common-tests.sh
          bash fabric/gradlew --no-daemon -p fabric build --stacktrace
          bash scripts/verify-built-jar.sh fabric
          bash neoforge/gradlew --no-daemon -p neoforge build --stacktrace
          bash scripts/verify-built-jar.sh neoforge

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-0.4-currency-block-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prevent village projects from generating bankable currency blocks'
          git push origin HEAD:fix/recover-0.4.0-beta.1
