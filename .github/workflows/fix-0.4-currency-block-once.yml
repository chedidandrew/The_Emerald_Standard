name: Finalize 0.4 recovery hardening once

on:
  push:
    branches: [fix/recover-0.4.0-beta.1]
    paths:
      - .github/workflows/fix-0.4-currency-block-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recover-0.4.0-beta.1
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Correct migration fixture and apply final reviewed hardening
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/cottage.approvedDay = 1L;/cottage.approvedDay = 0L;/' scripts/finalize_0_4_recovery.py
          sed -i 's/house.approvedDay = 2L;/house.approvedDay = 0L;/' scripts/finalize_0_4_recovery.py
          python3 scripts/finalize_0_4_recovery.py

      - name: Run regressions, migration coverage, and both loader builds
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-common-tests.sh
          bash fabric/gradlew --no-daemon -p fabric build --stacktrace
          bash scripts/verify-built-jar.sh fabric
          bash neoforge/gradlew --no-daemon -p neoforge build --stacktrace
          bash scripts/verify-built-jar.sh neoforge

      - name: Remove one-shot tooling and commit hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-0.4-currency-block-once.yml
          rm scripts/finalize_0_4_recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize safe 0.4.0 beta recovery'
          git push origin HEAD:fix/recover-0.4.0-beta.1
