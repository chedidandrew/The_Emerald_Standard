name: Fix beta2 Minecraft compile

on:
  push:
    branches:
      - fix/beta2-world-hardening
    paths:
      - '.github/workflows/fix-beta2-compile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Correct 26.2 zombie-villager package and verify both loaders
        run: |
          sed -i 's/import net.minecraft.world.entity.monster.ZombieVillager;/import net.minecraft.world.entity.monster.zombie.ZombieVillager;/' common/src/minecraft/java/com/chedidandrew/emeraldstandard/minecraft/VillageProsperityManager.java
          bash scripts/run-common-tests.sh
          bash fabric/gradlew --no-daemon -p fabric compileJava
          bash neoforge/gradlew --no-daemon -p neoforge compileJava
          git diff --check
          rm .github/workflows/fix-beta2-compile.yml
      - name: Commit compile correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Minecraft 26.2 zombie villager import"
          git push origin HEAD:fix/beta2-world-hardening
