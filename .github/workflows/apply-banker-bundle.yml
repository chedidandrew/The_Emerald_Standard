name: Apply Banker GUI bundle

on:
  push:
    branches:
      - feature/banker-gui-village-banks
    paths:
      - '.github/tes-bundle.b64'
      - '.github/workflows/apply-banker-bundle.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify and apply source bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '967c399d4b36cdcd04790a8ce9513f3a8f592574aad069f54a27ee04c3e92730  .github/tes-bundle.b64' | sha256sum -c -
          base64 -d .github/tes-bundle.b64 > /tmp/tes-bundle.tgz
          echo '75563184819e5a10cd42f832709b7b145a596861120df0fec0eaa413f23af651  /tmp/tes-bundle.tgz' | sha256sum -c -
          tar -xzf /tmp/tes-bundle.tgz
          rm -f .github/tes-bundle.b64 .github/workflows/apply-banker-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Banker GUI and natural village banks'
          git push origin HEAD:feature/banker-gui-village-banks
