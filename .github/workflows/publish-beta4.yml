name: Publish 0.3.0-beta.4 prerelease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-beta4.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-0.3.0-beta.4
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'chedidandrew/The_Emerald_Standard'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.3.0-beta.4
      TITLE: The Emerald Standard 0.3.0-beta.4
      SOURCE_SHA: 8881fe957cf5c19d940002921697e39969059d44
      BUILD_RUN_ID: '33791785017'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          fabric_version="$(sed -n 's/^mod_version=//p' fabric/gradle.properties)"
          neoforge_version="$(sed -n 's/^mod_version=//p' neoforge/gradle.properties)"
          [[ "$fabric_version" == "0.3.0-beta.4" ]]
          [[ "$neoforge_version" == "$fabric_version" ]]
          test -s release/RELEASE_NOTES-0.3.0-beta.4.md
          run_state="$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,event,headBranch --jq '[.status,.conclusion,.headSha,.event,.headBranch] | @tsv')"
          expected="completed"$'\t'"success"$'\t'"$SOURCE_SHA"$'\t'"push"$'\t'"main"
          [[ "$run_state" == "$expected" ]]

      - name: Download exact verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fabric dist/neoforge dist/release
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "the-emerald-standard-fabric-$SOURCE_SHA" --dir dist/fabric
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "the-emerald-standard-neoforge-$SOURCE_SHA" --dir dist/neoforge

          mapfile -t fabric_playable < <(find dist/fabric -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          mapfile -t fabric_sources < <(find dist/fabric -type f -name '*-sources.jar' | sort)
          mapfile -t neoforge_playable < <(find dist/neoforge -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          mapfile -t neoforge_sources < <(find dist/neoforge -type f -name '*-sources.jar' | sort)
          [[ ${#fabric_playable[@]} -eq 1 && ${#fabric_sources[@]} -eq 1 ]]
          [[ ${#neoforge_playable[@]} -eq 1 && ${#neoforge_sources[@]} -eq 1 ]]

          cp "${fabric_playable[0]}" dist/release/The-Emerald-Standard-Fabric-26.2-0.3.0-beta.4.jar
          cp "${fabric_sources[0]}" dist/release/The-Emerald-Standard-Fabric-26.2-0.3.0-beta.4-sources.jar
          cp "${neoforge_playable[0]}" dist/release/The-Emerald-Standard-NeoForge-26.2-0.3.0-beta.4.jar
          cp "${neoforge_sources[0]}" dist/release/The-Emerald-Standard-NeoForge-26.2-0.3.0-beta.4-sources.jar
          (cd dist/release && sha256sum *.jar | sort -k2 > The-Emerald-Standard-0.3.0-beta.4-SHA256SUMS.txt)

      - name: Publish immutable prerelease
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/release/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to replace a public release" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes-file release/RELEASE_NOTES-0.3.0-beta.4.md \
            --prerelease

      - name: Verify published bytes and metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,targetCommitish --jq '[.name,.isDraft,.isPrerelease,.targetCommitish] | @tsv')"
          expected="$TITLE"$'\t'"false"$'\t'"true"$'\t'"$SOURCE_SHA"
          [[ "$metadata" == "$expected" ]]
          mkdir -p dist/verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/verify
          mapfile -t expected_names < <(find dist/release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t actual_names < <(find dist/verify -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual_names[*]}" == "${expected_names[*]}" ]]
          for name in "${expected_names[@]}"; do
            cmp -s "dist/release/$name" "dist/verify/$name"
          done
