name: Add project compatibility test to common suite once

on:
  push:
    branches: [milestone-95]

permissions:
  contents: write

jobs:
  add-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-95
          fetch-depth: 0
      - name: Add compatibility guard to the normal regression suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-common-tests.sh')
          text = path.read_text()
          invocation = 'java -cp "$BUILD" com.chedidandrew.emeraldstandard.core.ProjectCatalogCompatibilityRegressionTest\n'
          if invocation not in text:
              marker = 'java -cp "$BUILD" com.chedidandrew.emeraldstandard.core.VillageProsperityRegressionTest\n'
              if marker not in text:
                  raise SystemExit('common test insertion marker missing')
              text = text.replace(marker, marker + invocation, 1)
              path.write_text(text)
          PY
          git rm .github/workflows/add-catalog-test-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-common-tests.sh
          git commit -m 'Run project compatibility guard in common CI'
          for attempt in 1 2 3; do
            if git push origin HEAD:milestone-95; then
              exit 0
            fi
            git pull --rebase origin milestone-95
          done
          exit 1
