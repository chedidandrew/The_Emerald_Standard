name: Build, test, and launch Minecraft 26.2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common-tests:
    name: Common economy regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test the loader-neutral economy
        run: bash scripts/run-common-tests.sh

  loader-builds:
    name: Build ${{ matrix.loader }}
    needs: common-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
      - name: Build ${{ matrix.loader }}
        run: gradle --no-daemon -p "${{ matrix.loader }}" build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: the-emerald-standard-${{ matrix.loader }}-${{ github.sha }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  dedicated-server-smoke:
    name: Launch ${{ matrix.loader }} dedicated server
    needs: loader-builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
      - name: Launch Minecraft server and verify mod startup
        run: bash scripts/smoke-server.sh "${{ matrix.loader }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-smoke-log-${{ matrix.loader }}-${{ github.sha }}
          path: build/server-smoke/${{ matrix.loader }}.log
          if-no-files-found: warn
