name: Build, test, and launch Minecraft 26.2

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  prepare-milestone:
    name: Prepare milestone branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test_ref: ${{ steps.ref.outputs.test_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name == 'milestone-95' && 'milestone-95' || github.sha }}
          fetch-depth: 0
      - name: Apply 0.4 milestone transformation once
        if: github.event_name == 'push' && github.ref_name == 'milestone-95'
        run: |
          if grep -q '^mod_version=0.4.0-beta.1$' fabric/gradle.properties; then
            echo 'Milestone transformation already applied.'
            exit 0
          fi
          python3 scripts/apply_milestone_95.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement 0.4.0 beta visible village progression'
          git push origin HEAD:milestone-95
      - name: Resolve commit to test
        id: ref
        run: echo "test_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  common-tests:
    name: Common economy regression tests
    needs: prepare-milestone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-milestone.outputs.test_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test the loader-neutral economy
        run: bash scripts/run-common-tests.sh

  loader-builds:
    name: Build ${{ matrix.loader }}
    needs: [prepare-milestone, common-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-milestone.outputs.test_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ${{ matrix.loader }}
        run: bash "${{ matrix.loader }}/gradlew" --no-daemon -p "${{ matrix.loader }}" build --stacktrace
      - name: Verify packaged ${{ matrix.loader }} JAR
        run: bash scripts/verify-built-jar.sh "${{ matrix.loader }}"
      - uses: actions/upload-artifact@v7
        with:
          name: the-emerald-standard-${{ matrix.loader }}-${{ needs.prepare-milestone.outputs.test_ref }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  dedicated-server-smoke:
    name: Launch ${{ matrix.loader }} dedicated server
    needs: [prepare-milestone, loader-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-milestone.outputs.test_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Launch Minecraft server and verify mod startup
        run: bash scripts/smoke-server.sh "${{ matrix.loader }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-smoke-log-${{ matrix.loader }}-${{ needs.prepare-milestone.outputs.test_ref }}
          path: build/server-smoke/${{ matrix.loader }}.log
          if-no-files-found: warn

  client-bootstrap-smoke:
    name: Launch ${{ matrix.loader }} client
    needs: [prepare-milestone, loader-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-milestone.outputs.test_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1
      - name: Launch Minecraft client and verify screen registration
        run: bash scripts/smoke-client.sh "${{ matrix.loader }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-smoke-log-${{ matrix.loader }}-${{ needs.prepare-milestone.outputs.test_ref }}
          path: build/client-smoke/${{ matrix.loader }}.log
          if-no-files-found: warn
