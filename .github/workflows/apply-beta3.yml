name: Apply beta.3 hardening

on:
  push:
    branches: [fix/beta3-completion]
    paths:
      - .github/workflows/apply-beta3.yml
      - scripts/apply-beta3-hardening.py

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'chedidandrew/The_Emerald_Standard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/beta3-completion
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply hardening changes
        run: python scripts/apply-beta3-hardening.py
      - name: Remove one-shot automation
        run: |
          rm -f scripts/apply-beta3-hardening.py
          rm -f .github/workflows/apply-beta3.yml
      - name: Commit and push
        run: |
          git config user.name 'chedidandrew'
          git config user.email '145610849+chedidandrew@users.noreply.github.com'
          git add -A
          git commit -m "Complete Village Prosperity beta.3 hardening" -m "Add protected-placement integration, nearby-only development snapshots, adaptive catch-up, better player casualty attribution, lightweight worker cues, NeoForge hand parity, regression coverage, and updated release documentation."
          git push origin HEAD:fix/beta3-completion
