name: Publish 0.2.0-alpha.3 prerelease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha3.yml
      - release/RELEASE_NOTES-0.2.0-alpha.3.md
      - release/ARTIFACTS-14ea4adc.md

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.repository == 'chedidandrew/The_Emerald_Standard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 14ea4adc5fafe909e23f5964c0c42746b2f7b665
      VERIFIED_RUN_ID: '33585169623'
      TAG: v0.2.0-alpha.3
    steps:
      - uses: actions/checkout@v7

      - name: Download verified workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/fabric dist/neoforge dist/release
          gh run download "$VERIFIED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "the-emerald-standard-fabric-$TARGET_SHA" \
            --dir dist/fabric
          gh run download "$VERIFIED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "the-emerald-standard-neoforge-$TARGET_SHA" \
            --dir dist/neoforge

      - name: Prepare and verify release files
        shell: bash
        run: |
          set -euo pipefail
          cp dist/fabric/the-emerald-standard-fabric-0.2.0-alpha.3.jar \
            dist/release/The-Emerald-Standard-Fabric-26.2-0.2.0-alpha.3.jar
          cp dist/fabric/the-emerald-standard-fabric-0.2.0-alpha.3-sources.jar \
            dist/release/The-Emerald-Standard-Fabric-26.2-0.2.0-alpha.3-sources.jar
          cp dist/neoforge/the-emerald-standard-neoforge-0.2.0-alpha.3.jar \
            dist/release/The-Emerald-Standard-NeoForge-26.2-0.2.0-alpha.3.jar
          cp dist/neoforge/the-emerald-standard-neoforge-0.2.0-alpha.3-sources.jar \
            dist/release/The-Emerald-Standard-NeoForge-26.2-0.2.0-alpha.3-sources.jar

          cd dist/release
          cat > expected.sha256 <<'CHECKSUMS'
          bd89baa11395406a87f9b298184443e9cefcabe0daf9d5d33b6c44ae9d4ed73e  The-Emerald-Standard-Fabric-26.2-0.2.0-alpha.3.jar
          6cac8eb435322ed1dc0d3b4365deef5e6755a5f411d7ddf9685fde790c3dc778  The-Emerald-Standard-Fabric-26.2-0.2.0-alpha.3-sources.jar
          c94119277a01a83f99c9b2cf286f07b0ea18c8a8a8ec13e2e04dd9d2b12b7894  The-Emerald-Standard-NeoForge-26.2-0.2.0-alpha.3.jar
          043982c86e6acba8f0854883bedf580b435c699b7ce66cea86bf45ab679ff054  The-Emerald-Standard-NeoForge-26.2-0.2.0-alpha.3-sources.jar
          CHECKSUMS
          sha256sum -c expected.sha256
          mv expected.sha256 The-Emerald-Standard-0.2.0-alpha.3-SHA256SUMS.txt

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/release/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "The Emerald Standard 0.2.0-alpha.3" \
              --notes-file release/RELEASE_NOTES-0.2.0-alpha.3.md \
              --prerelease
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "The Emerald Standard 0.2.0-alpha.3" \
              --notes-file release/RELEASE_NOTES-0.2.0-alpha.3.md \
              --prerelease
          fi

      - name: Remove merged development branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feature/banker-gui-village-banks \
            fix/alpha2-priority-hardening \
            fix/alpha-foundation \
            release/0.2.0-alpha.3; do
            git push origin --delete "$branch" || true
          done
