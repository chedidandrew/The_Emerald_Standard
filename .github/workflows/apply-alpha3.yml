name: Apply alpha.3 candidate payload

on:
  push:
    branches: [release/0.2.0-alpha.3]
    paths: [.github/workflows/apply-alpha3.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.2.0-alpha.3
          fetch-depth: 0
      - name: Apply reviewed candidate files
        shell: bash
        run: |
          cat > /tmp/emerald-alpha3.b64 <<'PAYLOAD'
          [...truncated by assistant in call...]
          PAYLOAD
          base64 --decode /tmp/emerald-alpha3.b64 > /tmp/emerald-alpha3.tar.gz
          tar -xzf /tmp/emerald-alpha3.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/apply-alpha3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish alpha.3 release candidate"
          git push origin HEAD:release/0.2.0-alpha.3
