name: Finalize validated 0.4 milestone

on:
  push:
    branches: [milestone-95]
    paths:
      - release/CI_STATUS-milestone-95.md

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: milestone-95-finalize
  cancel-in-progress: false

jobs:
  cleanup-and-merge:
    name: Clean temporary tooling and merge verified beta
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-95
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Require a completely green evidence report
        run: |
          grep -Fq 'Automated failures: **0**' release/CI_STATUS-milestone-95.md
          grep -Fq '| common-tests | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| scale-tests | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| fabric-build | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| neoforge-build | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| fabric-server | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| neoforge-server | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| fabric-client | PASS | 0 |' release/CI_STATUS-milestone-95.md
          grep -Fq '| neoforge-client | PASS | 0 |' release/CI_STATUS-milestone-95.md
      - name: Restore normal read-only CI and remove transformation tooling
        shell: bash
        run: |
          cat > .github/workflows/build.yml <<'YAML'
          name: Build, test, and launch Minecraft 26.2

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            common-tests:
              name: Common economy regression tests
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v6
                  with:
                    distribution: temurin
                    java-version: '25'
                - name: Compile and test the loader-neutral economy
                  run: bash scripts/run-common-tests.sh

            loader-builds:
              name: Build ${{ matrix.loader }}
              needs: common-tests
              runs-on: ubuntu-latest
              timeout-minutes: 30
              strategy:
                fail-fast: false
                matrix:
                  loader: [fabric, neoforge]
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v6
                  with:
                    distribution: temurin
                    java-version: '25'
                - uses: gradle/actions/setup-gradle@v6
                - name: Build ${{ matrix.loader }}
                  run: bash "${{ matrix.loader }}/gradlew" --no-daemon -p "${{ matrix.loader }}" build --stacktrace
                - name: Verify packaged ${{ matrix.loader }} JAR
                  run: bash scripts/verify-built-jar.sh "${{ matrix.loader }}"
                - uses: actions/upload-artifact@v7
                  with:
                    name: the-emerald-standard-${{ matrix.loader }}-${{ github.sha }}
                    path: ${{ matrix.loader }}/build/libs/*.jar
                    if-no-files-found: error

            dedicated-server-smoke:
              name: Launch ${{ matrix.loader }} dedicated server
              needs: loader-builds
              runs-on: ubuntu-latest
              timeout-minutes: 15
              strategy:
                fail-fast: false
                matrix:
                  loader: [fabric, neoforge]
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v6
                  with:
                    distribution: temurin
                    java-version: '25'
                - uses: gradle/actions/setup-gradle@v6
                - name: Launch Minecraft server and verify mod startup
                  run: bash scripts/smoke-server.sh "${{ matrix.loader }}"
                - uses: actions/upload-artifact@v7
                  if: always()
                  with:
                    name: server-smoke-log-${{ matrix.loader }}-${{ github.sha }}
                    path: build/server-smoke/${{ matrix.loader }}.log
                    if-no-files-found: warn

            client-bootstrap-smoke:
              name: Launch ${{ matrix.loader }} client
              needs: loader-builds
              runs-on: ubuntu-latest
              timeout-minutes: 15
              strategy:
                fail-fast: false
                matrix:
                  loader: [fabric, neoforge]
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v6
                  with:
                    distribution: temurin
                    java-version: '25'
                - uses: gradle/actions/setup-gradle@v6
                - name: Install virtual display dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends xvfb libgl1
                - name: Launch Minecraft client and verify screen registration
                  run: bash scripts/smoke-client.sh "${{ matrix.loader }}"
                - uses: actions/upload-artifact@v7
                  if: always()
                  with:
                    name: client-smoke-log-${{ matrix.loader }}-${{ github.sha }}
                    path: build/client-smoke/${{ matrix.loader }}.log
                    if-no-files-found: warn
          YAML
          sed -i 's/^          //' .github/workflows/build.yml
          rm -f scripts/apply_milestone_95.py
          rm -f .github/workflows/milestone-validation.yml
          rm -f .github/workflows/finalize-milestone.yml
      - name: Recheck loader-neutral suites after cleanup
        run: |
          bash scripts/run-common-tests.sh
          bash scripts/run-scale-tests.sh
      - name: Commit final source state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize verified 0.4.0 beta milestone'
          git push origin HEAD:milestone-95
      - name: Merge the verified public-beta milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 6 || true
          gh pr merge 6 --squash --delete-branch \
            --subject 'Release 0.4.0 beta village progression milestone' \
            --body 'Adds ten need-driven village projects, bounded biome-aware physical progression, local economic-impact guidance, scale regression coverage, and an explicit hands-on beta evidence gate. The complete automated matrix passed before merge; manual gameplay rows remain accurately marked unverified.'
