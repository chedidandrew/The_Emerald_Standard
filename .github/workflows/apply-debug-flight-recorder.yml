name: Apply debug flight recorder

on:
  push:
    branches: [feature/debug-flight-recorder]
    paths:
      - .github/workflows/apply-debug-flight-recorder.yml
      - scripts/debug-payload.part00
      - scripts/debug-payload.part01
      - scripts/debug-payload.part02
      - scripts/debug-payload.part03

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'chedidandrew/The_Emerald_Standard'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/debug-flight-recorder
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode and apply debug flight recorder changes
        run: |
          cat \
            scripts/debug-payload.part00 \
            scripts/debug-payload.part01 \
            scripts/debug-payload.part02 \
            scripts/debug-payload.part03 \
            | base64 --decode | gzip -d > /tmp/apply-debug-flight-recorder.py
          python /tmp/apply-debug-flight-recorder.py
      - name: Run loader-neutral regression tests
        run: bash scripts/run-common-tests.sh
      - name: Build Fabric candidate
        run: bash fabric/gradlew --no-daemon -p fabric build --stacktrace
      - name: Build NeoForge candidate
        run: bash neoforge/gradlew --no-daemon -p neoforge build --stacktrace
      - name: Verify packaged JARs
        run: |
          bash scripts/verify-built-jar.sh fabric
          bash scripts/verify-built-jar.sh neoforge
      - name: Remove one-shot automation
        run: |
          rm -f scripts/debug-payload.part00
          rm -f scripts/debug-payload.part01
          rm -f scripts/debug-payload.part02
          rm -f scripts/debug-payload.part03
          rm -f /tmp/apply-debug-flight-recorder.py
          rm -f .github/workflows/apply-debug-flight-recorder.yml
      - name: Commit and push candidate
        run: |
          git config user.name 'chedidandrew'
          git config user.email '145610849+chedidandrew@users.noreply.github.com'
          git add -A
          git commit -m "Add one-command debug flight recorder" -m "Add the five-minute /emerald debug capture, crash-resilient JSONL timeline, sanitized ZIP reports, automatic validation, market/village/construction/banking instrumentation, loader lifecycle hooks, version bump, and updated project documentation."
          git push origin HEAD:feature/debug-flight-recorder
