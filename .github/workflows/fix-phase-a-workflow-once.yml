name: Fix the 0.4 completion workflow once

on:
  push:
    branches: [milestone-95]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: milestone-95
          fetch-depth: 0
      - name: Replace generated YAML heredoc with the known-good main workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/complete-phase-a.yml')
          text = path.read_text()
          start_marker = "          cat > .github/workflows/build.yml <<'YAML'\n"
          end_marker = "          sed -i 's/^          //' .github/workflows/build.yml\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Completion-workflow heredoc anchors missing')
          end += len(end_marker)
          replacement = "          git show origin/main:.github/workflows/build.yml > .github/workflows/build.yml\n"
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git rm .github/workflows/fix-phase-a-workflow-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/complete-phase-a.yml
          git commit -m 'Fix exact-source phase A completion workflow'
          for attempt in 1 2 3; do
            if git push origin HEAD:milestone-95; then
              exit 0
            fi
            git pull --rebase origin milestone-95
          done
          exit 1
